# 三系统安装脚本 CI：install.sh（Linux/macOS/Windows via Git Bash）+ install.ps1（Windows）
# lite 仓：3 个 commands。零资金：只用 GitHub 免费 runner。
name: test-install

on:
  push:
    branches: [main, master]
  pull_request:

env:
  EXPECTED_COMMANDS: 3

jobs:
  install-sh:
    name: install.sh on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh with temp HOME
        shell: bash
        run: |
          export TEST_HOME="$(pwd)/.ci-home"
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" bash scripts/install.sh
          echo "--- claude commands ---"
          ls "$TEST_HOME/.claude/commands" | wc -l
          echo "--- codex skills ---"
          ls "$TEST_HOME/.codex/skills" | wc -l
          test "$(ls "$TEST_HOME/.claude/commands" | wc -l)" -eq "$EXPECTED_COMMANDS" || (echo "FAIL: expected $EXPECTED_COMMANDS claude commands" && exit 1)
          test "$(ls "$TEST_HOME/.codex/skills" | wc -l)" -eq "$EXPECTED_COMMANDS" || (echo "FAIL: expected $EXPECTED_COMMANDS codex skills" && exit 1)
          echo "--- spot check SKILL.md frontmatter (no cli: line) ---"
          test "$(grep -L '^cli:' "$TEST_HOME"/.codex/skills/*/SKILL.md | wc -l)" -eq "$EXPECTED_COMMANDS" || (echo "FAIL: cli: line leaked into SKILL.md" && exit 1)

      - name: Idempotency check (run twice)
        shell: bash
        run: |
          export TEST_HOME="$(pwd)/.ci-home"
          HOME="$TEST_HOME" bash scripts/install.sh >/dev/null
          test "$(ls "$TEST_HOME/.claude/commands" | wc -l)" -eq "$EXPECTED_COMMANDS" || (echo "FAIL: not idempotent" && exit 1)
          echo "idempotent OK"

  install-ps1:
    name: install.ps1 on windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run install.ps1 with temp HOME
        shell: pwsh
        run: |
          $env:HOME = Join-Path (Get-Location) '.ci-home-ps'
          New-Item -ItemType Directory -Force -Path $env:HOME | Out-Null
          .\scripts\install.ps1
          $claude = (Get-ChildItem (Join-Path $env:HOME '.claude\commands')).Count
          $codex = (Get-ChildItem (Join-Path $env:HOME '.codex\skills')).Count
          $expected = [int]$env:EXPECTED_COMMANDS
          Write-Host "claude commands: $claude / codex skills: $codex"
          if ($claude -ne $expected) { Write-Error "FAIL: expected $expected claude commands"; exit 1 }
          if ($codex -ne $expected) { Write-Error "FAIL: expected $expected codex skills"; exit 1 }

      - name: Idempotency check (run twice)
        shell: pwsh
        run: |
          $env:HOME = Join-Path (Get-Location) '.ci-home-ps'
          $expected = [int]$env:EXPECTED_COMMANDS
          .\scripts\install.ps1 | Out-Null
          $claude = (Get-ChildItem (Join-Path $env:HOME '.claude\commands')).Count
          if ($claude -ne $expected) { Write-Error "FAIL: not idempotent"; exit 1 }
          Write-Host "idempotent OK"
